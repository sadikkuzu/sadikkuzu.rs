[package]
name = "sadikkuzu"
version = "0.2.0"
edition = "2021"
authors = ["Sadık Kuzu <sadikkuzu@hotmail.com>"]
license = "MIT"
description = "All about SADIK KUZU"
readme = "README.md"
homepage = "https://github.com/sadikkuzu/sadikkuzu.rs"
repository = "https://github.com/sadikkuzu/sadikkuzu.rs"
keywords = ["cli", "personal", "sadikkuzu"]
categories = ["command-line-utilities"]
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "CHANGELOG.md"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.6", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
